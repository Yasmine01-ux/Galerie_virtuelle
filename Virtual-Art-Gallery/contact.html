<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Tun'Art - Contact / Réservation</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/contact.css">
</head>
<body>

<!-- AUDIO DE FOND -->
<audio autoplay loop>
    <source src="audio/Mozart Symphony No. 40 - DAVID BAY - MOZART 40.mp3" type="audio/mpeg">
</audio>

<!-- VIDEO DE FOND -->
<video class="bg-video" autoplay muted loop playsinline>
    <source src="video/tunisie.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<header class="header">
    <div class="logo">Tun<span>Art</span></div>
    <nav class="nav">
        <a href="index.html" class="home-btn">Page d'accueil</a>
    </nav>
</header>

<main class="contact-section">
    <div class="contact-box">
        <h1>Réservation / Contact</h1>
        <p>Vous pouvez réserver un événement ou poser une question. Sélectionnez l’option ci-dessous :</p>

        <form class="contact-form">
            <!-- Choix via radio -->
            <label>Je souhaite :</label>
            <div class="radio-inline">
                <input type="radio" id="question" name="type" checked>
                <label for="question">Poser une question</label>

                <input type="radio" id="reservation" name="type">
                <label for="reservation">Réserver un événement</label>
            </div>

            <!-- Champs communs -->
            <label for="nom">Nom :</label>
            <input type="text" id="nom" name="nom" placeholder="Votre nom" required>

            <label for="prenom">Prénom :</label>
            <input type="text" id="prenom" name="prenom" placeholder="Votre prénom" required>

            <label for="email">Email :</label>
            <input type="email" id="email" name="email" placeholder="Votre email" required>

            <label for="message">Message :</label>
            <textarea id="message" name="message" placeholder="Votre message..." rows="4"></textarea>

            <!-- Bloc réservation -->
            <div class="reservation-fields">
                <label>Sexe :</label>
                <div class="checkbox-inline">
                    <label>Femme <input type="checkbox" name="sexe[]" value="femme"></label>
                    <label>Homme <input type="checkbox" name="sexe[]" value="homme"></label>
                </div>

                <label for="evenement">Événement :</label>
                <select id="evenement" name="evenement">
                    <option value="">-- Sélectionner l'événement --</option>
                    <option value="Ammar Farhat - 25/12/2025">Ammar Farhat - 25/12/2025</option>
                    <option value="Hatem El Mekki - 26/12/2025">Hatem El Mekki - 26/12/2025</option>
                    <option value="Yahia Turki - 27/12/2025">Yahia Turki - 27/12/2025</option>
                    <option value="Safia Farhat - 28/12/2025">Safia Farhat - 28/12/2025</option>
                    <option value="Nja Mahdaoui - 29/12/2025">Nja Mahdaoui - 29/12/2025</option>
                </select>

                <label for="personnes">Nombre de personnes :</label>
                <input type="number" id="personnes" name="personnes" min="1" max="20" value="1">

                <label for="tarif">Tarif (TND) :</label>
                <input type="number" id="tarif" name="tarif" value="20">
            </div>

            <button type="submit">Envoyer</button>
        </form>
    </div>
</main>

<footer class="footer">
    <!-- Informations de contact à gauche -->
    <div class="footer-info">
        <p>Email : <a href="mailto:contact@tunart.tn">contact@tunart.tn</a></p>
        <p>Téléphone : <a href="tel:+21612345678">+216 12 345 678</a></p>
    </div>

    <!-- Réseaux sociaux à droite -->
    <div class="footer-socials">
        <a href="https://www.facebook.com" target="_blank" class="social-icon facebook">F</a>
        <a href="https://www.instagram.com" target="_blank" class="social-icon instagram">I</a>
        <a href="https://www.youtube.com" target="_blank" class="social-icon youtube">Y</a>
    </div>
</footer>

</body>
</html>
